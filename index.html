<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renkan (連環)</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header & Navigation -->
    <header class="header">
        <div class="header-top">
            <h1 class="kana-h1">Renkan (連環)</h1>
            <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle Theme">🌙 Dark</button>
        </div>

        <!-- View Switcher Tabs -->
        <div class="tab-buttons">
            <button class="tab-btn active" id="kanjiTabBtn" onclick="switchTab('kanji')">Kanji</button>
            <button class="tab-btn" id="radicalTabBtn" onclick="switchTab('radicals')">Radicals</button>
        </div>

        <!-- Global Search Bar -->
        <div class="search-container">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Search by kanji meaning or radical name..." 
                oninput="handleSearch(this.value)"
            >
        </div>
    </header>

    <!-- Main Content Container -->
    <main id="main-section">
        
        <!-- Kanji View -->
        <section id="kanjiView" class="tab-content active">
            <div id="kanjiContainer"></div>
        </section>

        <!-- Radicals View -->
        <section id="radicalsView" class="tab-content">
            <div class="kanji-lesson">
                <h3>All Radicals</h3>
                <p>Click a radical to view the Kanji characters formed by it.</p>
                <div id="radicalsGrid" class="kanji-grid"></div>
            </div>
        </section>

    </main>

    <!-- Character Details Modal Overlay -->
    <div id="modalOverlay" class="modal-overlay" onclick="closeModalOnOuterClick(event)">
        <div class="modal-card">
            <button class="modal-close-btn" onclick="closeModal()" aria-label="Close modal">&times;</button>
            <!-- Dynamic Modal Content -->
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
